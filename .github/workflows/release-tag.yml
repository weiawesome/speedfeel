name: 發佈-Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-tag:
    name: 發佈-Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 核對版本
        run: node --input-type=module -e 'import { readFileSync } from "node:fs"; const version = JSON.parse(readFileSync("package.json", "utf8")).version; const tag = process.env.GITHUB_REF_NAME; if (tag !== `v${version}`) { console.error(`這個 tag 是 ${tag}，package.json 是 ${version}，兩個不一樣`); process.exit(1) }'

      - name: 安裝
        run: npm ci

      - name: 建置
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: 打包
        run: |
          cp dist/index.html dist/404.html
          (cd dist && zip -r "../speedfeel-${GITHUB_REF_NAME}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: speedfeel-${{ github.ref_name }}
          path: speedfeel-${{ github.ref_name }}.zip

      - name: 建立 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "speedfeel-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes "speedfeel ${GITHUB_REF_NAME}。版本號來自 package.json，這個 zip 是頁面的建置結果。"
